# Gitleaks configuration for this public repository.
# Built-in rules stay on (useDefault). The extra rules below cover the Google OAuth credential formats used by the
# Google Drive backup tool this page describes. Do not add allowlists that hide real credentials; a false positive is
# handled narrowly (one fingerprint) after manual review. The workflow also runs Gitleaks with the built-in rules only.
title = "ask-again-later-privacy"

[extend]
useDefault = true

[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret"
regex = '''GOCSPX-[0-9A-Za-z_\-]{20,}'''
keywords = ["gocspx-"]

[[rules]]
id = "google-oauth-access-token"
description = "Google OAuth access token"
regex = '''ya29\.[0-9A-Za-z_\-]{20,}'''
keywords = ["ya29."]

[[rules]]
id = "google-oauth-refresh-token"
description = "Google OAuth refresh token"
regex = '''1//0[0-9A-Za-z_\-]{30,}'''
keywords = ["1//0"]

[[rules]]
id = "google-oauth-client-id"
description = "Google OAuth client ID"
regex = '''[0-9]{6,}-[0-9a-z]{20,}\.apps\.googleusercontent\.com'''
keywords = ["apps.googleusercontent.com"]

[[rules]]
id = "password-assignment"
description = "Password or secret assigned in text"
regex = '''(?i)\b(password|passwd|pwd|client_secret|secret_key)\s*[:=]\s*["']?[^\s"'<>]{8,}'''
keywords = ["password", "passwd", "pwd", "client_secret", "secret_key"]
